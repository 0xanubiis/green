name: Daily Commit Keeper

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  # Allows you to manually run the job from the "Actions" tab
  workflow_dispatch:

jobs:
  keep-graph-green:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Gives the action permission to push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make a change
        run: |
          echo "🟢 Commit on $(date -u)" >> daily-log.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-log.txt
          git commit -m "Daily commit: $(date -u)" || echo "No changes to commit"
          git push
